services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: todoapp-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - nginx_proxy_data:/data
      - nginx_proxy_letsencrypt:/etc/letsencrypt
    depends_on:
      - app

  mongo:
    image: mongo:7.0
    container_name: todoapp-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: todoapp-garage-prod
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    # Not published: the API reaches it as garage:3900, and the proxy serves it to the apps
    # on its own hostname (S3_PUBLIC_URL) for the upload and download links.
    expose:
      - "3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: attachments
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_prod_meta:/var/lib/garage/meta
      - garage_prod_data:/var/lib/garage/data

  app:
    # Built on the dev machine and shipped by ./deploy.sh; the server never builds.
    image: todoapp-api:latest
    container_name: todoapp-api-prod
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      GIN_MODE: release
      MONGO_URI: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      S3_ENDPOINT: http://garage:3900
      # Empty until the hostname exists: attachments stay off (the API answers 503 for them).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_BUCKET: attachments
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_started

volumes:
  mongo_prod_data:
  garage_prod_meta:
  garage_prod_data:
  nginx_proxy_data:
  nginx_proxy_letsencrypt:
