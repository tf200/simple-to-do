services:
  mongo:
    image: mongo:7.0
    container_name: todoapp-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: todoapp-garage-dev
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    # Published so the app on this machine can use the upload/download links the API signs.
    ports:
      - "3900:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: attachments
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_dev_meta:/var/lib/garage/meta
      - garage_dev_data:/var/lib/garage/data

  app:
    build: .
    container_name: todoapp-api-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:3900}
      S3_BUCKET: attachments
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_started

volumes:
  mongo_dev_data:
  garage_dev_meta:
  garage_dev_data:
